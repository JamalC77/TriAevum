name: VR Windows host runtime

# Builds the title-neutral host runtime (TriAevum.exe) the way the official
# Windows release is built: LLVM 22.1.6 clang-cl/lld-link, Vulkan SDK
# 1.4.350.0, vcpkg x64-windows-static, Ninja, whole-AOT product mode with the
# direct-AOT title plugin ABI and the NRI Vulkan renderer. No ROM, no title
# plugin, no generated title code and none of the separately licensed modules
# (iMMERSE, DLSS) are built or uploaded.

on:
  push:
    branches: [vr]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vr-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 22.1.6
  VULKAN_SDK_VERSION: 1.4.350.0
  VCPKG_REF: 2026.10.16
  LLVM_ROOT: C:\tools\llvm-22.1.6
  VULKAN_SDK: C:\VulkanSDK\1.4.350.0
  VCPKG_ROOT: C:\tools\vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: C:\tools\vcpkg-bincache
  VCPKG_BINARY_SOURCES: clear;files,C:\tools\vcpkg-bincache,readwrite
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
  VCPKG_DISABLE_METRICS: "1"
  SCCACHE_DIR: C:\tools\sccache
  SCCACHE_CACHE_SIZE: 6G
  SCCACHE_IDLE_TIMEOUT: "0"
  BUILD_DIR: C:\tb
  VCPKG_PACKAGES: zlib bzip2 libzip libpng sdl2 glew glfw3 nlohmann-json tinyxml2 spdlog libogg libvorbis opus opusfile

jobs:
  host-runtime:
    runs-on: windows-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Report runner
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free -AutoSize
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors
          cmake --version
          python --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---------------------------------------------------------------- LLVM
      - name: Restore LLVM ${{ env.LLVM_VERSION }}
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\tools\llvm-22.1.6
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc-v1

      - name: Install official LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $archive = "$env:RUNNER_TEMP\$name.tar.xz"
          curl.exe -fL --retry 5 -o $archive "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz"
          if ($LASTEXITCODE) { throw 'LLVM download failed' }
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          $extract = "$env:RUNNER_TEMP\llvm-extract"
          New-Item -ItemType Directory -Force $extract | Out-Null
          # Only the driver, linker, archiver, resource tools and Clang's
          # builtin headers are needed by the toolchain file.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $extract `
            "$name/bin/clang-cl.exe" "$name/bin/clang.exe" "$name/bin/lld-link.exe" `
            "$name/bin/lld.exe" "$name/bin/llvm-lib.exe" "$name/bin/llvm-ar.exe" `
            "$name/bin/llvm-rc.exe" "$name/bin/llvm-mt.exe" "$name/bin/llvm-ml.exe" `
            "$name/bin/llvm-objdump.exe" "$name/bin/llvm-readobj.exe" "$name/lib/clang"
          if ($LASTEXITCODE) { throw 'LLVM extraction failed' }
          Move-Item "$extract\$name" $env:LLVM_ROOT
          Remove-Item $archive -Force

      - name: Save LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\tools\llvm-22.1.6
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - name: Check LLVM
        run: |
          & "$env:LLVM_ROOT\bin\clang-cl.exe" --version
          if ($LASTEXITCODE) { throw 'clang-cl is not usable' }
          Get-ChildItem "$env:LLVM_ROOT\lib\clang" | Select-Object Name

      # ---------------------------------------------------------- Vulkan SDK
      - name: Restore Vulkan SDK ${{ env.VULKAN_SDK_VERSION }}
        id: vulkan-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\VulkanSDK\1.4.350.0
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows-x64-v1

      - name: Install Vulkan SDK ${{ env.VULKAN_SDK_VERSION }}
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\vulkansdk.exe"
          curl.exe -fL --retry 5 -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          if ($LASTEXITCODE) { throw 'Vulkan SDK download failed' }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', $env:VULKAN_SDK, '--accept-licenses', '--default-answer',
            '--confirm-command', 'install')
          if ($p.ExitCode) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }
          Remove-Item $installer -Force

      - name: Save Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\VulkanSDK\1.4.350.0
          key: ${{ steps.vulkan-cache.outputs.cache-primary-key }}

      - name: Check Vulkan SDK
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'Include\shaderc\shaderc.hpp', 'Lib\shaderc_shared.lib',
                         'Bin\shaderc_shared.dll', 'Bin\dxc.exe', 'Lib\vulkan-1.lib') {
            if (-not (Test-Path (Join-Path $env:VULKAN_SDK $f))) { throw "Vulkan SDK lacks $f" }
          }
          "$env:VULKAN_SDK\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # --------------------------------------------------------------- vcpkg
      - name: Prepare vcpkg ${{ env.VCPKG_REF }}
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch $env:VCPKG_REF https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE) { throw 'vcpkg clone failed' }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Find Visual Studio
        id: vs
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the x64 C++ toolset' }
          $msvc = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          "Visual Studio: $vs"
          "MSVC toolset: $msvc"
          "path=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "msvc=$msvc" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\tools\vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_REF }}-x64-windows-static-${{ steps.vs.outputs.msvc }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_REF }}-x64-windows-static-${{ steps.vs.outputs.msvc }}-
            vcpkg-${{ env.VCPKG_REF }}-x64-windows-static-

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install vcpkg static dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = $env:VCPKG_PACKAGES -split ' '
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static --host-triplet x64-windows-static @packages
          if ($LASTEXITCODE) {
            Get-ChildItem "$env:VCPKG_ROOT\buildtrees" -Recurse -Filter '*-err.log' -ErrorAction SilentlyContinue |
              ForEach-Object { "==== $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            throw 'vcpkg install failed'
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" list
          Remove-Item -Recurse -Force "$env:VCPKG_ROOT\buildtrees", "$env:VCPKG_ROOT\downloads" -ErrorAction SilentlyContinue

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\tools\vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # ------------------------------------------------------------- sccache
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Restore compiler cache
        id: sccache-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\tools\sccache
          key: sccache-vr-windows-${{ env.LLVM_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-vr-windows-${{ env.LLVM_VERSION }}-

      # ----------------------------------------------------------- configure
      - name: Configure
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OOT3D_LLVM_ROOT = $env:LLVM_ROOT
          $sccache = (Get-Command sccache -ErrorAction Stop).Source
          & $sccache --start-server
          $ninja = Join-Path '${{ steps.vs.outputs.path }}' 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
          if (-not (Test-Path $ninja)) { $ninja = (Get-Command ninja -ErrorAction Stop).Source }
          $src = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $vcpkg = $env:VCPKG_ROOT.Replace('\', '/')
          $llvm = $env:LLVM_ROOT.Replace('\', '/')
          $arguments = @(
            '-S', $src, '-B', $env:BUILD_DIR, '-G', 'Ninja',
            "-DCMAKE_MAKE_PROGRAM=$($ninja.Replace('\', '/'))",
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$src/CMake/Oot3dLlvmClToolchain.cmake",
            "-DVCPKG_ROOT=$vcpkg",
            "-DVCPKG_INSTALLED_DIR=$vcpkg/installed",
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static',
            '-DVCPKG_HOST_TRIPLET=x64-windows-static',
            '-DAUTOMATE_VCPKG_UPDATE=OFF',
            "-DOOT3D_LLVM_ROOT=$llvm",
            "-DCMAKE_C_COMPILER_LAUNCHER=$($sccache.Replace('\', '/'))",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$($sccache.Replace('\', '/'))",
            '-DOOT3D_WHOLE_AOT_PRODUCT_MODE=ON',
            '-DOOT3D_DIRECT_AOT_PLUGIN=ON',
            '-DOOT3D_ENABLE_VULKAN_RENDERER=ON',
            '-DTHREE_DS_RECOMP_ENABLE_DX11=OFF',
            '-DTRIAEVUM_DEVELOPER_TOOLS=OFF',
            '-DTHREE_DS_RECOMP_OFFER_EXPERIMENTAL_GI=OFF',
            '-DOOT3D_FAST_DEV_LINK=OFF',
            # Separately licensed modules stay out of this GPL fork build.
            '-DTHREE_DS_RECOMP_ENABLE_IMMERSE=OFF',
            '-DTHREE_DS_RECOMP_ENABLE_DLSS_MODULE=OFF',
            '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
          )
          cmake @arguments
          if ($LASTEXITCODE) { throw 'Configure failed' }

      # --------------------------------------------------------------- build
      - name: Build host runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          cmake --build $env:BUILD_DIR --target triaevum_public_runtime --parallel 4
          if ($LASTEXITCODE) { throw 'Build failed' }
          "Build took $([int]((Get-Date) - $start).TotalMinutes) min"
          sccache --show-stats

      - name: Inspect the built runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:BUILD_DIR 'TriAevum.exe'
          if (-not (Test-Path $exe)) { throw 'TriAevum.exe was not produced' }
          Get-ChildItem $env:BUILD_DIR -File | Where-Object Extension -in '.exe', '.dll', '.json' |
            Format-Table Name, Length -AutoSize
          & "$env:LLVM_ROOT\bin\llvm-readobj.exe" --coff-imports $exe | Select-String 'Name:' | Select-Object -Unique
          $env:PATH = "$env:BUILD_DIR;$env:PATH"
          $info = & $exe --product-info 2>&1
          "--product-info exit code: $LASTEXITCODE"
          $info

      - name: Stage artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\triaevum-host-windows"
          $sym = "$env:RUNNER_TEMP\triaevum-host-windows-symbols"
          New-Item -ItemType Directory -Force $out, $sym | Out-Null
          Copy-Item "$env:BUILD_DIR\TriAevum.exe" $out
          Copy-Item "$env:BUILD_DIR\triaevum-runtime-targets-Release.json" $out
          Copy-Item "$env:BUILD_DIR\symbols\*" $sym
          $exe = Join-Path $out 'TriAevum.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:PATH = "$env:BUILD_DIR;$env:PATH"
          $info = (& $exe --product-info 2>$null) -join "`n"
          [ordered]@{
            format = 'triaevum_vr_host_build_v1'
            source_commit = '${{ github.sha }}'
            run_id = '${{ github.run_id }}'
            runtime = 'TriAevum.exe'
            runtime_sha256 = $hash
            runtime_bytes = (Get-Item $exe).Length
            llvm = $env:LLVM_VERSION
            vulkan_sdk = $env:VULKAN_SDK_VERSION
            vcpkg = $env:VCPKG_REF
            msvc_toolset = '${{ steps.vs.outputs.msvc }}'
            modules_excluded = @('triaevum_immerse', 'triaevum_dlss')
            product_info = $info
          } | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 (Join-Path $out 'build-info.json')
          Get-Content (Join-Path $out 'build-info.json')

      - uses: actions/upload-artifact@v4
        with:
          name: triaevum-host-windows
          path: ${{ runner.temp }}\triaevum-host-windows
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: triaevum-host-windows-symbols
          path: ${{ runner.temp }}\triaevum-host-windows-symbols
          if-no-files-found: warn
          retention-days: 14

      - name: Stop compiler cache
        if: always()
        run: sccache --show-stats; sccache --stop-server; exit 0

      - name: Save compiler cache
        if: always() && steps.sccache-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: C:\tools\sccache
          key: ${{ steps.sccache-cache.outputs.cache-primary-key }}
